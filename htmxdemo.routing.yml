htmxdemo_links:
  path: "/htmxdemo-links"
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: "HTMX Demo Examples"
  requirements:
    _permission: "access content"

htmxdemo.basic:
  path: "/htmxdemo/basic"
  defaults:
    _controller: '\Drupal\htmxdemo\Controller\HtmxDemoController::basic'
    _title: "Basic"
  requirements:
    _permission: "access content"

htmxdemo.basic_response:
  path: "/htmxdemo/basic/response"
  defaults:
    _controller: '\Drupal\htmxdemo\Controller\HtmxDemoController::basicResponse'
  requirements:
    _permission: "access content"
  options:
    _htmx_route: TRUE

htmxdemo.random_number:
  path: "/htmxdemo/random"
  defaults:
    _controller: '\Drupal\htmxdemo\Controller\HtmxDemoController::randomNumber'
    _title: "A slightly more advanced example returning a random number"
  requirements:
    _permission: "access content"

htmxdemo.random_number_response:
  path: "/htmxdemo/random/response"
  defaults:
    _controller: '\Drupal\htmxdemo\Controller\HtmxDemoController::randomResponse'
    _title: "Returns a random number"
  requirements:
    _permission: "access content"
  options:
    _htmx_route: TRUE

htmxdemo.form:
  path: "/htmxform"
  defaults:
    _title: "Htmx form"
    _form: '\Drupal\htmxdemo\Form\HtmxdemoForm'
  requirements:
    _permission: "access content"

htmxdemo.form_add_more:
  path: "/htmxform/addmoreform"
  defaults:
    _title: "Add more form"
    _form: '\Drupal\htmxdemo\Form\HtmxdemoAddMoreForm'
  requirements:
    _permission: "access content"

htmxdemo.form_checkboxes:
  path: "/htmxform/checkboxform"
  defaults:
    _title: "Checkbox form"
    _form: '\Drupal\htmxdemo\Form\HtmxdemoCheckboxForm'
  requirements:
    _permission: "access content"

htmxdemo.infinite_scroll:
  path: "/htmxdemo/infinite-scroll"
  defaults:
    _title: "Htmx infinite scroll demo"
    _controller: '\Drupal\htmxdemo\Controller\HtmxdemoInfiniteScrollController::action'
  requirements:
    _permission: "access content"

htmxdemo.infinite_scroll_node:
  path: "/htmxdemo/infinite-scroll-node"
  defaults:
    _title: "Htmx infinite scroll + node demo"
    _controller: '\Drupal\htmxdemo\Controller\HtmxdemoInfiniteScrollNodeController::action'
  requirements:
    _permission: "access content"

htmxdemo.add_more_nodes:
  path: "/htmxdemo/add-more-nodes"
  defaults:
    _title: "Htmxdemo add more nodes"
    _controller: '\Drupal\htmxdemo\Controller\HtmxdemoAddMoreNodesController::action'
  requirements:
    _permission: "access content"

htmxdemo.cascade_form:
  path: "/htmxform/cascade"
  defaults:
    _title: "Htmx Cascade Form"
    _form: '\Drupal\htmxdemo\Form\HtmxdemoCascadeForm'
  requirements:
    _permission: "access content"

htmxdemo.postcode_lookup:
  path: "/htmxform/postcodeLookup"
  defaults:
    _controller: '\Drupal\htmxdemo\Controller\HtmxDemoController::postcodeLookup'
    _title: "Htmx postcode loookup"
    userPostcode: ""
  requirements:
    _permission: "access content"
  options:
    _htmx_route: TRUE

htmxdemo.query_search_form:
  path: "/htmxdemo/query-search"
  defaults:
    _title: "Query search"
    _form: '\Drupal\htmxdemo\Form\HtmxdemoQuerySearchForm'
  requirements:
    _permission: "access content"

htmxdemo.search_route:
  path: "/htmxdemo/search"
  defaults:
    _controller: '\Drupal\htmxdemo\Controller\HtmxdemoSearchController::search'
    _title: "Search"
  methods: [GET, QUERY]
  requirements:
    _permission: "access content"
  options:
    _htmx_route: TRUE

htmxdemo.shipping_calculator:
  path: "/htmxform/shippingCalculator"
  defaults:
    _controller: '\Drupal\htmxdemo\Controller\HtmxDemoController::calculateShipping'
    _title: "Htmx shipping calculator"
    userPostcode: ""
    userSelection: ""
  requirements:
    _permission: "access content"
  options:
    _htmx_route: TRUE

htmxdemo.tabbed:
  path: "/htmxdemo/tabbed"
  defaults:
    _controller: '\Drupal\htmxdemo\Controller\HtmxdemoTabbedController::action'
    _title: "Htmx demo tabbed example"
  requirements:
    _permission: "access content"

htmxdemo.memory:
  path: "/htmxdemo/memory"
  defaults:
    _controller: '\Drupal\htmxdemo\Controller\HtmxdemoMemoryController::action'
    _title: "Htmxdemo memory game"
  requirements:
    _permission: "access content"

htmxdemo.wizard:
  path: "/htmxform/wizard"
  defaults:
    _controller: '\Drupal\htmxdemo\Controller\HtmxDemoController::wizard'
  requirements:
    _permission: "access content"
  options:
    _htmx_route: TRUE

htmxdemo.dashboard:
  path: "/htmxdemo/dashboard"
  defaults:
    _controller: '\Drupal\htmxdemo\Controller\HtmxdemoDashboardController::page'
    _title: "Htmx and Alpine dashboard"
  methods: [GET]
  requirements:
    _permission: "access content"
  options:
    no_cache: TRUE

htmxdemo.dashboard.card_add:
  path: "/htmxdemo/dashboard/card"
  defaults:
    _controller: '\Drupal\htmxdemo\Controller\HtmxdemoDashboardController::addCard'
  methods: [POST]
  requirements:
    _permission: "access content"
    _csrf_request_header_token: "TRUE"
  options:
    _htmx_route: TRUE
    no_cache: TRUE

htmxdemo.dashboard.card_body:
  path: "/htmxdemo/dashboard/card/{uuid}"
  defaults:
    _controller: '\Drupal\htmxdemo\Controller\HtmxdemoDashboardController::cardBody'
  # POST lets forms inside a card submit back to the card.
  methods: [GET, POST]
  requirements:
    _permission: "access content"
    uuid: "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"
  options:
    _htmx_route: TRUE
    no_cache: TRUE

htmxdemo.dashboard.card_delete:
  path: "/htmxdemo/dashboard/card/{uuid}"
  defaults:
    _controller: '\Drupal\htmxdemo\Controller\HtmxdemoDashboardController::deleteCard'
  methods: [DELETE]
  requirements:
    _permission: "access content"
    _csrf_request_header_token: "TRUE"
    uuid: "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"
  options:
    _htmx_route: TRUE
    no_cache: TRUE

htmxdemo.dashboard.sort:
  path: "/htmxdemo/dashboard/sort"
  defaults:
    _controller: '\Drupal\htmxdemo\Controller\HtmxdemoDashboardController::sort'
  methods: [POST]
  requirements:
    _permission: "access content"
    _csrf_request_header_token: "TRUE"
  options:
    no_cache: TRUE
